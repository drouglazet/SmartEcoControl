set_derogation:
  target:
    entity:
      integration: smart_ecocontrol
      domain: climate
  fields:
    allure:
      required: true
      default: comfort
      selector:
        select:
          options:
            - eco
            - comfort
            - frost
          translation_key: derogation_allure
    duration:
      required: false
      selector:
        number:
          min: 0.25
          max: 24
          step: 0.25
          unit_of_measurement: h
          mode: box

cancel_derogation:
  target:
    entity:
      integration: smart_ecocontrol
      domain: climate

set_vacation:
  target:
    entity:
      integration: smart_ecocontrol
      domain: switch
  fields:
    until:
      required: true
      selector:
        date:

get_planning:
  fields:
    planning:
      required: false
      example: SEMAINE
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: smart_ecocontrol

set_planning_day:
  fields:
    planning:
      required: true
      example: SEMAINE
      selector:
        text:
    days:
      required: true
      default: [mon, tue, wed, thu, fri]
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
          translation_key: weekday
    ranges:
      required: true
      example: '[{"start": "06:30", "end": "08:30"}, {"start": "18:00", "end": "22:30"}]'
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: smart_ecocontrol

copy_planning_day:
  fields:
    planning:
      required: true
      example: SEMAINE
      selector:
        text:
    source_day:
      required: true
      default: mon
      selector:
        select:
          options: [mon, tue, wed, thu, fri, sat, sun]
          translation_key: weekday
    target_days:
      required: true
      default: [tue, wed, thu, fri]
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
          translation_key: weekday
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: smart_ecocontrol

create_planning:
  fields:
    name:
      required: true
      example: TELETRAVAIL
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: smart_ecocontrol

rename_planning:
  fields:
    planning:
      required: true
      example: SEMAINE
      selector:
        text:
    name:
      required: true
      example: SEMAINE HIVER
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: smart_ecocontrol

delete_planning:
  fields:
    planning:
      required: true
      example: TELETRAVAIL
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: smart_ecocontrol
